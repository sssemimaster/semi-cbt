<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SemiCBT - 반도체 직무 전공 AI 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- 공통 상단 네비게이션 -->
  <header class="bg-indigo-900 text-white p-4 shadow-md flex justify-between items-center relative z-10">
    <h1 class="text-xl font-bold tracking-tight cursor-pointer" onclick="changeView('view-lobby')">
      ⚡ SemiCBT
    </h1>
    <button class="bg-indigo-700 hover:bg-indigo-600 text-xs px-3 py-1.5 rounded-lg transition" onclick="changeView('view-lobby')">
      🏠 홈으로
    </button>
  </header>

  <main class="flex-1 max-w-2xl w-full mx-auto p-4 flex flex-col justify-center">
    
    <!-- ==========================================
         [화면 1] 메인 로비 (Lobby)
         ========================================== -->
    <div id="view-lobby" class="w-full flex flex-col space-y-4">
      <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-8 text-center mb-4">
        <h2 class="text-2xl font-bold text-slate-800 mb-2">반도체 취업 마스터</h2>
        <p class="text-slate-500 text-sm">원하는 학습 모드를 선택하세요.</p>
      </div>

      <button onclick="alert('학습 파트는 다음 단계에서 추가됩니다!')" class="w-full bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 text-emerald-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
        <span class="text-3xl mb-2">📖</span>
        <span class="font-bold text-lg">과목별 이론 학습</span>
        <span class="text-xs text-emerald-600 mt-1">반도체 8대 공정 및 소자 이론 백과</span>
      </button>

      <button onclick="changeView('view-setup')" class="w-full bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 text-indigo-800 p-6 rounded-2xl flex flex-col items-center justify-center transition shadow-sm">
        <span class="text-3xl mb-2">📝</span>
        <span class="font-bold text-lg">실전 모의고사 (CBT)</span>
        <span class="text-xs text-indigo-600 mt-1">AI 생성 기출문제 및 직무 면접 대비</span>
      </button>
    </div>

    <!-- ==========================================
         [화면 2] 시험 설정 (Exam Setup)
         ========================================== -->
    <div id="view-setup" class="hidden w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <h2 class="text-xl font-bold text-slate-800 mb-6">모의고사 설정</h2>
      
      <div class="mb-4">
        <label class="block text-sm font-semibold text-slate-700 mb-2">과목 선택</label>
        <select id="select-subject" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
          <option value="ALL">✨ 전체 과목 통합</option>
          <option value="반도체 8대 공정">반도체 8대 공정</option>
          <option value="포토 공정">포토 공정</option>
          <option value="식각 공정">식각 공정</option>
          <option value="증착 및 이온주입">증착 및 이온주입</option>
          <option value="HBM 및 TSV 패키징">HBM 및 TSV 패키징</option>
          <option value="반도체 공정 데이터 분석">반도체 공정 데이터 분석</option>
        </select>
      </div>

      <div class="mb-8">
        <label class="block text-sm font-semibold text-slate-700 mb-2">난이도 선택</label>
        <select id="select-difficulty" class="w-full bg-slate-50 border border-slate-200 text-slate-700 rounded-lg p-3 outline-none focus:border-indigo-500">
          <option value="ALL">✨ 전체 난이도</option>
          <option value="초급">초급</option>
          <option value="중급">중급</option>
          <option value="고급">고급</option>
        </select>
      </div>

      <button onclick="startQuiz()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-xl transition shadow-md">
        시험 시작하기
      </button>
    </div>

    <!-- ==========================================
         [화면 3] 문제 풀이 (Quiz View) - 기존 구조 재활용
         ========================================== -->
    <div id="view-quiz" class="hidden w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
      <div class="flex justify-between items-center mb-4">
        <span id="categoryBadge" class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-2.5 py-1 rounded">과목명</span>
        <span id="progressText" class="text-xs text-slate-400 font-medium">1 / 10</span>
      </div>

      <h2 id="questionTitle" class="text-lg font-bold text-slate-900 mb-6 leading-snug">문제 지문</h2>

      <div id="optionsContainer" class="space-y-3">
        <!-- 보기 버튼이 JS로 생성됨 -->
      </div>

      <div id="explanationBox" class="mt-6 p-4 bg-slate-50 border border-slate-200 rounded-xl hidden">
        <div id="resultStatus" class="font-bold text-sm mb-1"></div>
        <p id="explanationText" class="text-sm text-slate-600 leading-relaxed"></p>
        <button id="nextBtn" onclick="nextQuestion()" class="mt-4 w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition">다음 문제</button>
      </div>
    </div>

  </main>

  <script>
    // 전역 변수
    let allQuizData = [];    // 서버에서 불러온 전체 문제
    let filteredQuiz = [];   // 유저가 설정한 조건에 맞게 필터링된 문제
    let currentIndex = 0;    // 현재 풀고 있는 문제 번호

    // 앱 시작 시 전체 데이터 1회 불러오기
    async function initApp() {
      try {
        const res = await fetch('./data/questions.json');
        allQuizData = await res.json();
      } catch (error) {
        console.error("데이터 로드 실패:", error);
      }
    }

    // 화면 전환 함수
    function changeView(viewId) {
      document.getElementById('view-lobby').classList.add('hidden');
      document.getElementById('view-setup').classList.add('hidden');
      document.getElementById('view-quiz').classList.add('hidden');
      
      document.getElementById(viewId).classList.remove('hidden');
    }

    // 시험 시작 로직 (필터링 및 섞기)
    function startQuiz() {
      const selectedSubject = document.getElementById('select-subject').value;
      const selectedDifficulty = document.getElementById('select-difficulty').value;

      // 조건에 맞는 문제만 추출
      filteredQuiz = allQuizData.filter(q => {
        const matchSubj = (selectedSubject === "ALL" || q.category === selectedSubject);
        const matchDiff = (selectedDifficulty === "ALL" || q.difficulty === selectedDifficulty);
        return matchSubj && matchDiff;
      });

      if (filteredQuiz.length === 0) {
        alert("선택하신 조건에 맞는 문제가 아직 없습니다. 다른 조건을 선택해 주세요.");
        return;
      }

      // 문제를 랜덤하게 섞기
      filteredQuiz = filteredQuiz.sort(() => Math.random() - 0.5);
      
      currentIndex = 0;
      changeView('view-quiz');
      renderQuestion();
    }

    // 문제 화면 렌더링
    function renderQuestion() {
      const q = filteredQuiz[currentIndex];
      
      // 난이도를 뱃지 옆에 같이 표시
      document.getElementById('categoryBadge').innerText = `${q.category} (${q.difficulty})`;
      document.getElementById('progressText').innerText = `문제 ${currentIndex + 1} / ${filteredQuiz.length}`;
      document.getElementById('questionTitle').innerText = q.question;
      
      const container = document.getElementById('optionsContainer');
      container.innerHTML = '';
      document.getElementById('explanationBox').classList.add('hidden');

      q.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 transition font-medium text-sm text-slate-700 flex items-center";
        btn.innerHTML = `<span class="w-6 h-6 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center text-xs mr-3 font-semibold flex-shrink-0">${idx + 1}</span> <span>${opt}</span>`;
        btn.onclick = () => checkAnswer(idx);
        container.appendChild(btn);
      });
    }

    // 정답 확인 로직
    function checkAnswer(selectedIndex) {
      const q = filteredQuiz[currentIndex];
      const isCorrect = selectedIndex === q.answer;
      
      const box = document.getElementById('explanationBox');
      const status = document.getElementById('resultStatus');
      const text = document.getElementById('explanationText');
      const container = document.getElementById('optionsContainer');

      // 중복 클릭 방지
      Array.from(container.children).forEach(btn => btn.disabled = true);

      box.classList.remove('hidden');
      if (isCorrect) {
        status.className = "font-bold text-sm mb-1 text-emerald-600";
        status.innerText = "⭕ 정답입니다!";
      } else {
        status.className = "font-bold text-sm mb-1 text-rose-600";
        status.innerText = `❌ 오답입니다. (정답: ${q.answer + 1}번)`;
      }
      text.innerText = q.explanation;
      
      // 마지막 문제일 경우 버튼 텍스트 변경
      const nextBtn = document.getElementById('nextBtn');
      if (currentIndex === filteredQuiz.length - 1) {
        nextBtn.innerText = "시험 종료 및 결과 보기";
        nextBtn.className = "mt-4 w-full bg-slate-800 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-slate-900 transition";
      } else {
        nextBtn.innerText = "다음 문제";
        nextBtn.className = "mt-4 w-full bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-semibold hover:bg-indigo-700 transition";
      }
    }

    // 다음 문제로 넘어가기
    function nextQuestion() {
      if (currentIndex < filteredQuiz.length - 1) {
        currentIndex++;
        renderQuestion();
      } else {
        alert('수고하셨습니다! 모든 문제를 풀었습니다.\n(추후 여기에 점수 결과 화면이 추가됩니다)');
        changeView('view-lobby');
      }
    }

    // 페이지 로드 시 초기화 실행
    initApp();
  </script>
</body>
</html>
