name: Daily Quiz Generator (OpenAI)

on:
  schedule:
    # 매일 한국 시간 아침 7시 (UTC 기준 밤 10시)에 자동 실행
    - cron: '0 22 * * *'
  workflow_dispatch: # 버튼을 눌러 수동 실행 허용

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 🟢 설치 라이브러리를 openai로 변경
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai

    # 🟢 환경 변수를 OPENAI_API_KEY로 변경
    - name: Run Python Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python scripts/generate_questions.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/questions.json
        git commit -m "Auto-generated new quiz question via OpenAI" || echo "No changes to commit"
        git push
