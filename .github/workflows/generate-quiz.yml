name: Auto News Scraper & Quiz Generator

on:
  schedule:
    # 다시 30분마다 실행되도록 원복!
    - cron: '*/30 * * * *'
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 크롤링을 위한 requests, beautifulsoup4 라이브러리 포함
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install openai requests beautifulsoup4

    - name: Run Python Script
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      run: python scripts/generate_questions.py

    - name: Commit and Push changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/questions.json data/theories.json
        git commit -m "Auto-scraped news and generated new quiz/theory" || echo "No changes to commit"
        git push
